name: kenza_hub_flutter
description: Kenza Hub marketplace application
version: 0.1.0+1
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.4.0
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  intl: any
  url_launcher: ^6.2.5
  connectivity_plus: ^6.0.3
  flutter_localizations:
    sdk: flutter
  go_router: ^14.2.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/welcome/
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/animations/
