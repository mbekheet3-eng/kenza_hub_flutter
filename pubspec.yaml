name: kenza_hub
description: Marketplace for buying/selling used clothes in Egypt
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.5.0
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Image Handling
  image_picker: ^1.0.0
  image_picker_android: ^0.8.8
  image_picker_ios: ^0.8.8
  image_cropper: ^5.0.0
  cached_network_image: ^3.3.1
  
  # File & Storage
  path_provider: ^2.1.0
  permission_handler: ^11.4.0
  
  # Networking & HTTP
  http: ^1.1.0
  dio: ^5.3.0
  
  # JSON & Serialization
  json_annotation: ^4.8.1
  
  # Validation & Formatting
  validators: ^3.0.0
  intl: ^0.19.0
  
  # UI Components
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  shimmer: ^3.0.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Environment
  flutter_dotenv: ^5.1.0
  
  # Error Handling
  sentry_flutter: ^7.0.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Camera
  camera: ^0.10.5
  video_player: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - .env
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
