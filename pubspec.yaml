name: kenza_hub_marketplace
description: Kenza Hub marketplace - phase one
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.18.3
  firebase_core: 4.15.2
  firebase_messaging: 16.7.1
  image_picker: 1.2.0
  intl: ^0.20.3
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/welcome/
    - assets/images/
