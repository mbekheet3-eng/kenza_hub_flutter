name: kenza_hub_flutter
description: Kenza Hub marketplace application
version: 0.1.0+1
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  provider: 6.1.5+1
  dio: 5.11.0
  supabase_flutter: 2.12.4
  shared_preferences: 2.2.3
  cached_network_image: 3.4.1
  flutter_svg: 2.2.4
  intl: ^0.20.3
  url_launcher: 6.2.6
  connectivity_plus: 7.3.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/animations/
