workflows:
  android-mvp:
    name: Kenza Hub Android Update APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Generate Android launcher icons
        script: |
          dart run flutter_launcher_icons -f pubspec.yaml
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
      - name: Analyze Flutter code
        script: flutter analyze
      - name: Build signed release APK
        script: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Add ANDROID_KEYSTORE_BASE64 in CodeMagic environment variables}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Add ANDROID_KEYSTORE_PASSWORD in CodeMagic environment variables}"
          : "${ANDROID_KEY_ALIAS:?Add ANDROID_KEY_ALIAS in CodeMagic environment variables}"
          : "${ANDROID_KEY_PASSWORD:?Add ANDROID_KEY_PASSWORD in CodeMagic environment variables}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          test -s android/upload-keystore.jks
          flutter build apk --release --no-shrink \
            --build-name=0.1.0 \
            --build-number="$(date +%s)"
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
