name: Flutter Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-tests:
    name: Analyze and test Kenza
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: phase-1/prelaunch-critical-fixes

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run automated tests
        run: flutter test
