name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build debug APK
    # Add concurrency to avoid duplicate/competing runs and reduce queue pressure
    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: false
    # Use an explicit Ubuntu image version to avoid transient hosted-runner allocation issues
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5' # ✅ Updated for Dart 3.4+ compatibility (pubspec.yaml requires >=3.4.0)

      - name: 📋 Check Flutter and Dart versions
        run: |
          echo "Flutter version:"
          flutter --version
          echo ""
          echo "Dart version:"
          dart --version

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze code
        run: flutter analyze

      - name: 🧪 Run tests
        run: flutter test
        continue-on-error: true

      - name: 🔨 Build debug APK
        run: flutter build apk --debug --no-shrink

      - name: 📤 Verify APK exists
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "❌ APK file not found: build/app/outputs/flutter-apk/app-debug.apk"
            exit 1
          else
            echo "✅ APK file found"
            ls -lh build/app/outputs/flutter-apk/app-debug.apk
          fi

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
