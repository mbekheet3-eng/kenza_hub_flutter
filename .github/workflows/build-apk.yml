name: Build APK

# Build the working MVP branch after each code update and allow manual runs.
on:
  push:
    branches: [feature/db-schema-alignment]
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Build debug APK
    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'

      - name: Check Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests when a test suite exists
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Dart test files found; test execution skipped."
          fi

      - name: Build debug APK
        run: flutter build apk --debug --no-shrink

      - name: Verify APK exists
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            echo "APK file not found: build/app/outputs/flutter-apk/app-debug.apk"
            exit 1
          fi
          echo "APK file found"
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
