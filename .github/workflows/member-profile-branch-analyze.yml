name: Member profile branch analysis

on:
  push:
    branches:
      - feature/member-profile-name-avatar
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/member-profile-branch-analyze.yml'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/member-profile-name-avatar

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze
