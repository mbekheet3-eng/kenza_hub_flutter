name: 🤖 ChatGPT Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'lib/**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'

# Reviews may comment on pull requests but must never push or modify source code.
permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the reviewer from the trusted PR base, never from PR-controlled code.
      - name: Checkout trusted review script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-review
          persist-credentials: false

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          pip install openai==1.3.0

      - name: 🔍 Analyze Code with ChatGPT
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.CHATGPT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python trusted-review/.github/scripts/code_review.py

      - name: 💬 Post Review Comments
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review_output.txt', 'utf8');

            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: review,
              event: 'COMMENT'
            });

      - name: 📊 Summary
        if: always()
        run: |
          echo "Code review workflow finished."
