name: 🤖 ChatGPT Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'lib/**/*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          pip install openai==1.3.0 pyyaml

      - name: 🔍 Analyze Code with ChatGPT
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python .github/scripts/code_review.py

      - name: 💬 Post Review Comments
        if: steps.review.outputs.review_body != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review_output.txt', 'utf8');
            
            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: review,
              event: 'COMMENT'
            });

      - name: ✅ Auto-Fix Code Issues
        id: autofix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/auto_fix.py

      - name: 📤 Commit Auto-Fixes
        if: steps.autofix.outputs.changes_made == 'true'
        run: |
          git config user.name "🤖 ChatGPT Code Review Bot"
          git config user.email "chatgpt-bot@kenza-hub.local"
          git add .
          git commit -m "fix: Auto-fixes by ChatGPT Code Review Bot

- Fixed code issues detected by AI
- Improved code quality
- Applied best practices
- [Auto-generated by ChatGPT]"
          git push

      - name: 📊 Summary
        run: |
          echo "✅ Code Review Completed"
          echo "📝 Review posted to PR"
          echo "🔧 Auto-fixes applied if any"
