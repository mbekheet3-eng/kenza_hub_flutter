name: Flutter analyze

on:
  push:
    branches:
      - phase-1/implementation
      - phase-1/prelaunch-critical-fixes
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'docs/proposed_miscellaneous_categories.sql'
      - 'scripts/test_category_migrations.sh'
      - 'scripts/test_product_offer_inventory_migration.sh'
      - 'supabase/SCHEMA.md'
      - '.github/workflows/flutter-analyze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-function-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test Gemini model fallback behavior
        run: deno test supabase/functions/tests/review-product-images-test.ts

  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

  category-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate category migrations on disposable PostgreSQL
        run: bash scripts/test_category_migrations.sh
      - name: Validate product inventory and offer migrations on disposable PostgreSQL
        run: bash scripts/test_product_offer_inventory_migration.sh
